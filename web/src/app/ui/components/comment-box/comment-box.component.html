<div class="box">
  @if (avatarUrl()) {
    <img class="avatar" [src]="avatarUrl()" alt="" width="28" height="28" />
  } @else {
    <span class="avatar avatar--empty" aria-hidden="true"></span>
  }

  <div class="editor">
    <textarea
      #textarea
      rows="3"
      [placeholder]="placeholder()"
      [value]="body()"
      [disabled]="busy()"
      aria-label="Comment"
      (input)="body.set(textarea.value)"
      (keydown)="onKeydown($event)"
    ></textarea>

    <p class="hint">
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
        <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" />
        <path d="M8 7v4M8 4.6v.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
      </svg>
      <a href="https://docs.github.com/get-started/writing-on-github" target="_blank" rel="noopener">Markdown supported.</a>
      Ctrl+Enter to comment.
    </p>

    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }

    <div class="footer">
      <div class="toolbar" role="toolbar" aria-label="Formatting">
        @for (tool of tools; track tool.format) {
          <button
            type="button"
            [class]="'tool tool--' + tool.format"
            [title]="tool.label"
            [attr.aria-label]="tool.label"
            [disabled]="busy()"
            (mousedown)="$event.preventDefault()"
            (click)="format(tool.format)"
          >
            {{ tool.icon }}
          </button>
        }
      </div>
      <div class="actions">
        <button type="button" class="btn" [disabled]="busy()" (click)="cancelled.emit()">Cancel</button>
        <button type="button" class="btn btn--primary" [disabled]="!canSubmit()" (click)="submit()">
          {{ busy() ? 'Posting…' : submitLabel() }}
        </button>
      </div>
    </div>
  </div>
</div>
